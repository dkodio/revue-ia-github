# Laboratoire local seulement. Lire docs/GUIDE.md avant une mise en production.
services:
  openproject:
    image: ${OPENPROJECT_IMAGE:-openproject/openproject:17}
    environment:
      SECRET_KEY_BASE: ${OPENPROJECT_SECRET_KEY_BASE:?Executer scripts/init_env.py}
      OPENPROJECT_HOST__NAME: localhost:8080
      OPENPROJECT_HTTPS: "false"
      OPENPROJECT_DEFAULT__LANGUAGE: fr
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - op_pgdata:/var/openproject/pgdata
      - op_assets:/var/openproject/assets
  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    profiles: ["llm-container"]
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
volumes:
  op_pgdata:
  op_assets:
  ollama_data:
