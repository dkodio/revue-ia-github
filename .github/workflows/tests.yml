name: Tests du robot

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer les dépendances du robot
        run: python -m pip install -e .
      - name: Exécuter les tests unitaires
        run: python -m unittest discover -s tests -v
      - name: Vérifier la démonstration
        run: python -m review.cli demo --out /tmp/review-demo
