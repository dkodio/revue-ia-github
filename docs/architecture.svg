<title id="title">Architecture avec GitHub OpenProject et sept agents IA</title>
<desc id="desc">Les tickets OpenProject et les diffs GitHub alimentent six agents spécialisés. Ollama exécute le modèle local. L'agent sept synthétise les résultats, suivis d'une validation humaine.</desc>
